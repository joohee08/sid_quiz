<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETC Screen</title>
    <link rel="stylesheet" href="css/etc.css">
</head>
<body>
    <!-- 해설 -->
    <div id="Popup">
        <div id="PopupContent">
            <!-- 하얀 박스 이미지 -->
            <img src="img/title_etc.png" alt="title_etc" class="title_etc">
            <!-- 텍스트 이미지 -->
            <div class="text-container">
                <img src="img/title_txt.png" alt="title_txt" class="title_txt">
            </div>
        </div>
    
        <!-- 버튼 영역 -->
        <div id="Buttons">
            <div class="retry-button">
                <img src="img/retry_btn.png" alt="Retry"> 
            </div>
            <div class="next-button">
                <img src="img/nextMun_btn.png" alt="Next"> 
            </div>
        </div>
    </div>

</body>
</html>
