<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quiz5</title>
    <link rel="stylesheet" href="css/quiz5.css">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script type="text/javascript" src="js/quiz_m.js"></script>

    <!-- Input박스 -->
	<script>
		function validateInput(input) {
			// 입력값이 1글자를 초과하면 첫 번째 글자만 유지
			if (input.value.length > 1) {
				input.value = input.value.charAt(0);
			}
	
			// 숫자나 특정 문자만 허용 , 주석 해제
			// input.value = input.value.replace(/[^가-힣a-zA-Z0-9]/g, ""); // 예: 한글, 영문, 숫자만 허용
		}
	</script>
</head>

<body>
    <!--문제 1번 -->
    <div class="Section quiz1" style="display:block;">
        <div id="Con5">
            <img src="img/Quiz5-1.png" alt="Background">
            <!-- 선택 박스 -->
            <div class="Select_con">
                <div class="One">
                    <div class="Ex01 Btn">
                        <img src="img/Ex01.png" alt="선택1"class="btn-1">
                    </div>

                    <div class="Ex02 Btn">
                        <img src="img/Ex02.png" alt="선택2"class="btn-2">
                    </div>

                    <div class="Ex03 Btn">
                        <img src="img/Ex03.png" alt="선택3"class="btn-3">
                    </div>
                </div>

                <div class="Two">
                    <div class="Ex04 Btn">
                        <img src="img/Ex04.png" alt="선택4"class="btn-4">
                    </div>

                    <div class="Ex05 Btn">
                        <img src="img/Ex05.png" alt="선택5"class="btn-5">
                    </div>
                </div>
            </div>
           <!-- 캐릭터 이미지 -->
           <div class="Character1">
            <div class="qman"></div>
            <div class="oman"></div>
            <div class="xman"></div>
        </div>

        <div class="next">
            <button id="nextQuizButton">다음 문제</button>
        </div>
        </div>
    </div>


    <!--문제 2번  -->
    <div class="Section quiz2" style="display:none;">
        <div id="Con5">
            <img src="img/Quiz5-2.png" alt="Background">
            <div class="Input_con">
                <!-- 1문단 -->
                <div class="Sentence">
                    <div class="Input_box" style="position:absolute">
                        <input type="text" class="Ex01-2 inputRect" maxlength="1" oninput="validateInput(this)">
                        <input type="text" class="Ex02-2 inputRect" style="left: 41px;" maxlength="1" oninput="validateInput(this)">
                        <input type="text" class="Ex03-2 inputRect" style="left: 82px;" maxlength="1" oninput="validateInput(this)">
                        <input type="text" class="Ex04-2 inputRect" style="left: 123px;" maxlength="1" oninput="validateInput(this)">
                    </div>

                    <div class="Input_box2" style="position:absolute">
                        <input type="text" class="Ex05-2 inputRect" maxlength="1" oninput="validateInput(this)">
                        <input type="text" class="Ex06-2 inputRect" style="left: 41px;" maxlength="1" oninput="validateInput(this)">
                        <input type="text" class="Ex07-2 inputRect" style="left: 82px;" maxlength="1" oninput="validateInput(this)">
                        <input type="text" class="Ex08-2 inputRect" style="left: 123px;" maxlength="1" oninput="validateInput(this)">
                    </div>
                </div>
               
                <div class="btns">
                    <input type="image" src="img/ok-btn.png" alt="정답확인 버튼" width="225" height="70">
                </div>
            </div>
             <!-- 캐릭터 이미지 -->
           <div class="Character1">
            <div class="qman"></div>
            <div class="oman"></div>
            <div class="xman"></div>
        </div>
        </div>
    </div>
</body>

</html>
