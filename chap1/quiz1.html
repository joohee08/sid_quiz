<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quiz1</title>
    <link rel="stylesheet" href="css/quiz1.css">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script type="text/javascript" src="js/quiz_m.js"></script>
</head>

<body>
    <div class="Section quiz1" style="display:none;">
        <div id="Con1">
            <img src="img/Quiz1-1.png" alt="Background">
            <div class="Select_con">
                <div class="Select1">
                    <div class="Line_1">
                        <!-- 구역 -->
                        <div class="Ex01 ChkBtn">
                            <img src="img/Ex01.png" alt="선택1">
                            <img src="img/Check.png" alt="체크1" class="Check">
                        </div>
                        <div class="Ex02 ChkBtn">
                            <img src="img/Ex02.png" alt="선택2">
                            <img src="img/Check.png" alt="체크2" class="Check">
                        </div>
                    </div>
                </div>

                <div class="Select2">
                    <div class="Line_2">
                        <!-- 구역 -->
                        <div class="Ex03 ChkBtn">
                            <img src="img/Ex03.png" alt="선택3">
                            <img src="img/Check.png" alt="체크3" class="Check">
                        </div>
                        <div class="Ex04 ChkBtn">
                            <img src="img/Ex04.png" alt="선택4">
                            <img src="img/Check.png" alt="체크4" class="Check">
                        </div>
                    </div>
                </div>
            </div>
            <!-- 캐릭터 이미지 -->
            <div class="Character1">
                <div class="qman"></div>
                <div class="oman"></div>
                <div class="xman"></div>
            </div>

            <div class="next">
                <button id="nextQuizButton">다음 문제</button>
            </div>
        </div>
    </div>


   <!--문제 2번  -->
   <div class="Section quiz2">
    <div id="Con1">
        <img src="img/Quiz1-2.png" alt="Background">
        <!-- 선택 박스 -->
        <div class="Select_con2">
            <div class="One">
                <div class="Ex01-2 Btn">
                    <img src="img/Ex01-2.png" alt="선택1" class="btn-1">
                </div>

                <div class="Ex02-2 Btn">
                    <img src="img/Ex02-2.png" alt="선택2" class="btn-2">
                </div>
            </div>

            <div class="Two">
                <div class="Ex03-2 Btn">
                    <img src="img/Ex03-2.png" alt="선택3" class="btn-3">
                </div>
            </div>

            <!-- 3문단 하나의 버튼 -->
            <div class="Three">
                <div class="Btn">
                    <div class="Ex04-2">
                        <img src="img/Ex04-2.png" alt="선택4" class="btn-4">
                    </div>
                    <div class="Ex05-2">
                        <img src="img/Ex05-2.png" alt="선택5" class="btn-5">
                    </div>
                </div>
            </div>

            <div class="Four">
                <div class="Ex06-2 Btn">
                    <img src="img/Ex06-2.png" alt="선택6" class="btn-6">
                </div>
            </div>
        </div>
        <!-- 캐릭터 이미지 -->
        <div class="Character1">
            <div class="qman"></div>
            <div class="oman"></div>
            <div class="xman"></div>
        </div>
    </div>
</div>
</body>

</html>
