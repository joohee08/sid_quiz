<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quiz2</title>
    <link rel="stylesheet" href="css/quiz2.css">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script type="text/javascript" src="js/quiz_m.js"></script>
</head>

<body>
    <!-- 문제1 -->
    <div class="Section quiz1" style="display:block;">
        <div id="Con2">
            <img src="img/Quiz2-1.png" alt="Background">
            <div class="Select_con">
                  <!-- 선택 요소 -->
                  <div class="Camera Btn">
                    <img src="img/Ex01.png" alt="정답 카메라" class="Ex01" style="top: 2px; left: -2px;">
                  </div>
  
                  <div class="Tab Btn">
                    <img src="img/Ex02.png" alt="정답 탭" class="Ex02">
                  </div>
  
                  <div class="Speaker Btn">
                    <img src="img/Ex03.png" alt="정답 스피커" class="Ex03" style="top: 1px; left: 4px;">
                  </div>
  
                  <div class="Dron Btn">
                    <img src="img/Ex04.png" alt="정답 드론" class="Ex04">
                  </div>
  
                  <div class="Wifi Btn">
                    <img src="img/Ex05.png" alt="정답 와이파이" class="Ex05">
                  </div>
  
                  <div class="Computer Btn">
                    <img src="img/Ex06.png" alt="정답 컴퓨터" class="Ex06">
                  </div>
            </div>
          <!-- 캐릭터 이미지 -->
						<div class="Character1">
							<div class="qman"></div>
							<div class="oman"></div>
							<div class="xman"></div>
						</div>

            <div class="next">
              <button id="nextQuizButton">다음 문제</button>
          </div>
        </div>
    </div>

    <!-- 문제2 -->
    <div class="Section quiz2" style="display: block;">
      <div id="Con2">
        <img src="img/Quiz2-2.png" alt="Background">
        <!-- 문제 구역 -->
        <div class="Drag_con2">
        <!-- 빈칸 구역(1) -->
          <div class="Drag_Area">
          <!-- 공통으로 들어가는 빈칸 -->
          <div class="Same_Area">
            <div class="blank-box Ex01-2" id="drop-area-1-1" style="background-image: url('img/Blank01-1.png');"></div>
            <div class="blank-box Ex02-2" id="drop-area-1-2" style="background-image: url('img/Blank01-2.png');"></div>
          </div>
          <div class="blank-box Ex03-2" id="drop-area-2" style="background-image: url('img/Blank02.png');"></div>
          <div class="blank-box Ex04-2" id="drop-area-3" style="background-image: url('img/Blank03.png');"></div>
          </div>
  
        <!-- 보기 구역(2) -->
          <div class="Btn_Area">
          <input type="image" src="img/Btn01.png" alt="버튼1" class="Btn01 btn-word" id="button-1">
          <input type="image" src="img/Btn02.png" alt="버튼2" class="Btn02 btn-word" id="button-2">
          <input type="image" src="img/Btn03.png" alt="버튼3" class="Btn03 btn-word" id="button-3">
          </div>
        </div>
         <!-- 캐릭터 이미지 -->
        <div class="Character1">
          <div class="qman"></div>
          <div class="oman"></div>
          <div class="xman"></div>
        </div>
      </div>
    </div>
</body>

</html>
